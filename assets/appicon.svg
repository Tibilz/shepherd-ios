<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Original icon for the Unofficial herdr App: a chat bubble with a terminal prompt and three agent status dots. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A44"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EAF2"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- speech bubble -->
  <path d="M232 250 h560 a90 90 0 0 1 90 90 v300 a90 90 0 0 1 -90 90 h-330 l-130 110 v-110 h-100 a90 90 0 0 1 -90 -90 v-300 a90 90 0 0 1 90 -90 z" fill="url(#bubble)"/>
  <!-- terminal prompt >_ -->
  <path d="M300 395 l110 85 l-110 85" fill="none" stroke="#1F2A44" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="540" width="170" height="50" rx="25" fill="#1F2A44"/>
  <!-- agent status dots: working, needs you, done -->
  <circle cx="755" cy="395" r="36" fill="#0A84FF"/>
  <circle cx="755" cy="490" r="36" fill="#FF9F0A"/>
  <circle cx="755" cy="585" r="36" fill="#34C759"/>
</svg>
