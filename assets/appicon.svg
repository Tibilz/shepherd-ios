<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Shepherd app icon: original design (shepherd's crook + terminal prompt). Full-bleed for iOS. -->
  <rect width="1024" height="1024" fill="#f4f1e9"/>
  <g fill="none" stroke="#303438" stroke-linecap="round" stroke-linejoin="round">
    <!-- crook: staff with an open hook -->
    <path d="M662 870 V360 A146 146 0 0 0 370 360 V430 C370 478 344 500 306 500" stroke-width="80"/>
    <!-- prompt ">_" -->
    <path d="M196 640 L292 712 L196 784" stroke-width="54"/>
    <path d="M350 800 H462" stroke-width="54"/>
  </g>
  <!-- status dot -->
  <circle cx="800" cy="300" r="40" fill="#3fa66b"/>
</svg>
